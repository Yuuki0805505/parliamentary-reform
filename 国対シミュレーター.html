function dOf(d){const t=new Date(S.start);t.setDate(t.getDate()+d);return t}
function md(d){const t=dOf(d);return `${t.getMonth()+1}/${t.getDate()}`}
function wdy(d){return '日月火水木金土'[dOf(d).getDay()]}
function buildPhases(){
  const ph=[];const off=(dOf(0).getDay()+6)%7;
  for(let d=0;d<=S.endDay;d++){
    const w=dOf(d).getDay();const key=(w===1||w===2)?'A':(w===3||w===4)?'B':'C';const wk=Math.floor((d+off)/7);
    const last=ph[ph.length-1];
    if(last&&last.key===key&&last.wk===wk)last.days.push(d);else ph.push({key,wk,days:[d]});
  }

/* ---- 委員会 ---- */

function commSeats(h,c){

function dealMode(){return S.side==='gov'?'gov':(UI.deal.camp==='gov'?(S.side==='mid'?'midGov':'toGov'):'toOpp')}
function nikanOK(){const d=UI.deal;return S.side!=='mid'&&d.parties.length===1&&d.parties[0]===(S.side==='gov'?'minsei':'kyowa')&&S.nikanWeek!==weekNo()}
const MULTI=['sched','yes','abs','oppose'];
function dealScores(){
  const d=UI.deal;const mode=dealMode();const b=d.bill?B(d.bill):null;const out={};const nik=d.nikan&&nikanOK();
  const BL=(d.bills||[]).map(B).filter(Boolean);const multi=MULTI.includes(d.ask)&&BL.length>1;
  for(const p of d.parties){
    const tg=mode==='toGov'||mode==='midGov';
    const base=(tg?govAcceptBase(d.ask,b,nik):(multi?BL.reduce((a,x)=>a+oppAcceptBase(p,d.ask,x),0)/BL.length-4*(BL.length-1):oppAcceptBase(p,d.ask,b)))-(d.same&&(d.ask==='sched'||d.offers.includes('sched'))?6:0);
    let v=0;for(const o of d.offers)v+=tg?(o==='sched'&&BL.length>1?BL.reduce((a,x)=>a+govOfferVal('sched',x),0)*.7:govOfferVal(o,b)):offerVal(o,p,b,d.taian);
    if(d.offers.length>3)v-=(d.offers.length-3)*4;
    if(nik)v+=15;

}
function noise(p,salt){return ((S.turn*31+p.length*17+(salt||0)*7)%23)-11}
function dealValid(){

  if(d.ask==='package'&&!(d.nikan&&nikanOK()))return '一括決着は二幹二国（野党第一党の幹事長・国対委員長との会談）でのみ求められます';
  if(d.nikan&&!nikanOK())return S.nikanWeek===weekNo()?'二幹二国は週1回まで（幹事長の日程が取れない）':'二幹二国は相手を野党第一党（与党側なら国民協和党）1党にしてください';
  const needBill=['sched','yes','abs','ts','mod','futai','delay','sankonin','special','oppose','cosign','attend','noforce'];

  if(['yes','abs','oppose','mod','futai','delay','sankonin','special','attend','noforce'].includes(d.ask)&&!live(b))return '審議中の案件を選んでください';
  if(d.ask==='cosign'&&!(b&&b.member==='opp'))return '野党の対案を選んでください';
  if((d.ask==='taian'||d.offers.includes('taian'))&&!d.taian)return '並行審議する対案を選んでください';

  if(d.offers.includes('sched')&&!(b&&b.phase==='committee'))return '採決日程は委員会で審査中の案件について示せます';

  if(d.offers.includes('yes')&&d.ask!=='mod'&&!(d.ybill&&live(B(d.ybill))))return '賛成する政府案を選んでください';
  if(d.offers.includes('yes')&&d.ask==='mod'&&b&&b.member)return '賛成を約束できるのは政府案です';
  if(['futai','sankonin','delay','qgive','attend','noforce'].some(o=>d.offers.includes(o))&&!(b&&live(b)))return 'その条件には対象の案件が必要です';
  for(const p of d.parties)if(S.met[p])return `${P[p].short}とはこのフェーズに会談済みです（相手の日程が取れない）`;

function doDeal(){

  clampAll();

function runCommittees(){
  const groups={};
  for(const b of S.bills)if(b.phase==='committee'&&b.voteOrder!=='mid'&&b.hmSkip!==S.turn){const k=b.house+'|'+ck(b.house,b.comm);(groups[k]=groups[k]||[]).push(b)}
  const budgetIn={shu:S.bills.some(b=>b.type==='budget'&&!b.extraBill&&b.phase==='committee'&&b.house==='shu'),san:S.bills.some(b=>b.type==='budget'&&!b.extraBill&&b.phase==='committee'&&b.house==='san')};
  const pf=S.side==='gov'?.35:.15;const speech=pStart()<6;
  for(const k in groups){
    const [h,c]=k.split('|');const q=groups[k].sort((a,b)=>a.prio-b.prio);
    let cap=capOf(h,c)*S.capMod;
    if(S.turn===0)cap=0;else if(speech)cap*=.3;
    if(c==='yosan')cap*=S.yosanMod;
    if(c==='yosan'&&S.ysNow&&S.ysNow[h])cap*=S.ysNow[h]==='k'?.5:0;
    if(budgetIn[h]&&c!=='yosan'&&!isSp(c)&&!q.some(b=>b.brel))cap=Math.min(cap,.7);
    if(S.sat[h])cap*=1.6;if(S.night[h])cap+=1;if(h==='san'&&S.sanBoost>0)cap+=.7;
    cap-=S.capCut[h];cap+=S.extra[k]||0;
    if(S.half[h])cap*=.5;if(S.chairMotion[k])cap=0;
    let present=true;
    if(S.boycott[h]){if(S.shokken[h]&&chairGov(h,c)){cap*=.6;present=false}else cap=0}
    cap=Math.max(0,cap);let rem=cap;const got=new Map();
    const act=q.filter(b=>!S.halt[b.id]&&!(S.minRefuse&&b.min===S.minRefuse&&!S.shokken[h]));
    for(const b of act){let mult=S.minSkip[b.min]?.6:1;const g=Math.min(rem,Math.max(0,b.need[h]-b.hours[h])/mult);b.hours[h]+=g*mult;rem-=g;got.set(b,g)}
    if(rem>0&&act[0]){act[0].hours[h]+=rem;got.set(act[0],(got.get(act[0])||0)+rem)}
    for(const [b,g] of got)if(g>0&&present&&b.member!=='opp')b.opp+=g*b.weak*pf*(S.minSkip[b.min]?.5:1)*(b.qgive?1.3:1);
  }
}

function dealBetrayals(b){

  }
}

function D(o){return o}
function newDirective(){

  const pool=[];const has=k=>S.directives.some(d=>d.kind===k&&!d.done&&!d.failed);const any=k=>S.directives.some(d=>d.kind===k);
  const due=n=>Math.min(NT-1,T+n);

function triggerEvent(){
  const pool=EVENTS.filter(e=>e.cond());if(!pool.length)return;
  let tot=pool.reduce((a,e)=>a+e.w,0),r=rnd()*tot,e=pool[0];for(const x of pool){r-=x.w;if(r<=0){e=x;break}}
  const ev=e.make();if(ev.pre)ev.pre();
  log('event',`【出来事】${ev.title}：${ev.text}`);
  if(S.side!=='gov'){let tw=ev.gov.reduce((a,o)=>a+o.w,0),rr=rnd()*tw,g=ev.gov[0];for(const o of ev.gov){rr-=o.w;if(rr<=0){g=o;break}}const k=S.kantei,pp=S.party,rr0={...S.rel};g.f();S.kantei=k;S.party=pp;if(S.side==='mid')S.rel=rr0;ev.govChoice=g.l}
  clampAll();UI.modal={type:'event',ev};
}
function chooseEvent(i){
  const ev=UI.modal.ev;const opts=S.side==='gov'?ev.gov:ev.opp;const o=opts[i];
  if(o.ap&&S.ap<o.ap){toast('行動力が足りません');return}
  S.ap-=o.ap||0;o.f();clampAll();UI.modal=null;
  if(openDealLater){const x=openDealLater;openDealLater=null;openDeal(x);return}
  render();
}

/* ================= 時間単位の攻防（予算の3月2日・会期末） ================= */
const HMSTEP={q:'質疑',shime:'締めくくり総括質疑',cvote:'委員会採決',giun:'上程',debate:'委員長報告・討論',vote:'本会議採決'};
const HMORDER=['q','shime','cvote','giun','debate','vote'];
const HMOFFER={policy:{label:'次の政策協議で貴党の要求を優先する',v:6},seirin:{label:'政治倫理審査会での審議を続ける',v:14},tokui:{label:'政治改革の特別委員会を設置する',v:12},shuchu:{label:'後日、首相出席の集中審議を開く',v:10},futai:{label:'附帯決議を付ける',v:6},addq:{label:'今日の質疑を1時間追加する',v:8},mod:{label:'条文・予算の修正に応じる',v:24}};
function chairName(h,c){return commName(h,c).replace(/委員会$/,'委員長')}
function hmTotMin(t){return Math.round(t*60)}
function hmClock(t,withDate){const tot=hmTotMin(t);const dd=Math.floor(tot/1440),mm=tot%1440;const s=`${String(Math.floor(mm/60)).padStart(2,'0')}:${String(mm%60).padStart(2,'0')}`;if(!withDate)return s;const d=S.hm.d0+dd;return `${md(d)}（${wdy(d)}）${s}`}
function hmDeadText(){const H=S.hm;const tot=hmTotMin(H.dead);if(tot%1440===0){const d=H.d0+tot/1440-1;return `${md(d)}（${wdy(d)}）24:00`}return hmClock(H.dead,true)}
function hmDay(t){return S.hm.d0+Math.floor(hmTotMin(t)/1440)}
function hdur(h){h=Math.max(0,h);const m=Math.round(h*60);return m>=60?`${Math.floor(m/60)}時間${m%60?m%60+'分':''}`:`${m}分`}
function hlog(text,cat){const H=S.hm;H.log.unshift({t:H.t,text,cat:cat||'sys'});H.flag=true}
function hmCandidate(b){
  if(!live(b)||b.member==='opp'||b.extraBill)return false;
  const fin=b.phase==='kaifu'||b.house!==b.first;
  if(!fin)return false;
  if(b.phase==='plenary'||b.phase==='kaifu')return true;
  if(b.phase==='committee')return b.hours[b.house]>=b.need[b.house]*.5;
  return false;
}
function hmMaybeStart(){
  if(S.hm||S.over)return;
  const days=PH().days;
  if(S.kind==='tsujo'&&!S.hmBudget&&days.some(d=>d===38||d===39)){
    const y=B('yosan');
    if(y&&y.house==='shu'&&['committee','plenary'].includes(y.phase)){S.hmBudget=true;startHM('budget');return}
  }
  if(isLast()&&!S.hmEnd){const c=S.bills.filter(hmCandidate);if(c.length){S.hmEnd=true;startHM('end',c)}}
}
function newLane(){return {inter:[],filib:false,gyuho:false,limit:false,vlimit:false,shokken:false,boy:false,kinkyu:false,stallLog:false}}
function startHM(kind,list){
  const d0=kind==='budget'?Math.max(38,pStart()):pStart();
  const dead=kind==='budget'?(39-d0)*24+24:(S.endDay-d0)*24+24;
  const bills=kind==='budget'?[B('yosan')]:list.slice();
  if(kind==='budget')for(const b of S.bills)if(b.brel&&b.type==='law'&&b.house==='shu'&&(b.phase==='plenary'||(b.phase==='committee'&&b.hours.shu>=b.need.shu*.8))){b.hmFollow=true;bills.push(b)}
  S.hm={kind,d0,t:9,dead,night:0,ids:bills.map(b=>b.id),lanes:{shu:newLane(),san:newLane()},log:[],used:{},lastDeal:-99,lastOffer:-99,offer:null,peace:false,done:false,result:null,filed:0,turn:S.turn,flag:false};
  if(kind==='budget'){const y=bills[0];if(!ysReady(y,'shu')){const yy=ys(y,'shu');const miss=(yy.k<2?1:0)+(yy.b<2?1:0);yy.k=2;yy.b=2;y.hours.shu=Math.max(0,y.hours.shu-miss*3);log('bad',`公聴会・分科会の日程が遅れ、3月1日の朝に駆け込みで済ませた扱いに。そのぶん締めくくりまでの質疑時間が押している。`)}}
  for(const b of bills){b.hmLocked=true;b.hmSkip=S.turn;hmInit(b)}
  if(S.side==='opp')for(const l of ['shu','san'])S.hm.lanes[l].kinkyu=true;
  const y=bills[0];
  if(kind==='budget'){
    log('sys',`【予算攻防】${md(d0)}の朝、総予算はまだ衆院にある。3月2日中に衆院を通過して参院に送られれば、参院が議決しなくても年度内に自然成立する。ここから時間単位の攻防に入る。`);
    hlog(`${HN.shu}予算委員会が開会。${y.phase==='committee'?(y.hours.shu<y.need.shu?`残りの質疑は約${hdur(y.need.shu-y.hours.shu)}。続いて首相出席の締めくくり総括質疑、討論・採決。`:'質疑は目安に達している。首相出席の締めくくり総括質疑、討論・採決へ。'):'予算は本会議への上程を待っている。'}期限は${md(39)}（${wdy(39)}）24:00までの参院送付。`);
  } else {
    log('sys',`【会期末攻防】会期が終わる${md(S.endDay)}の24時まで、残る${bills.length}件をめぐる時間単位の攻防に入る。`);
    hlog(`会期末の攻防が始まった。成立を目指す案件は${bills.length}件（対決法案：${bills.filter(hmHeavy).map(b=>b.short).join('、')||'なし'}）。会期は${md(S.endDay)}（${wdy(S.endDay)}）の24:00で終わる。`);
  }
  S.hm.flag=false;
}
function hmInit(b){
  const h=b.house;
  if(b.phase==='committee'){
    const rem=Math.max(0,b.need[h]-b.hours[h]);
    if(b.hmFollow){b.hm={stage:'cvote',rem:.2};return}
    b.hm=rem>.05?{stage:'q',rem}:(b.type==='budget'&&h==='shu'?{stage:'shime',rem:2}:{stage:'cvote',rem:hmHeavy(b)?.5:.2});
  }
  else if(b.phase==='plenary')b.hm={stage:'giun',rem:hmHeavy(b)?.5:.1};
  else if(b.phase==='kaifu')b.hm={stage:'debate',rem:.5};
  else b.hm=null;
}
function hmBills(){return S.hm.ids.map(B).filter(b=>b&&b.hm&&['committee','plenary','kaifu'].includes(b.phase))}
function laneOf(b){return b.phase==='kaifu'?b.first:b.house}
function hmSort(a,b){return (b.type==='budget'?1:0)-(a.type==='budget'?1:0)||(a.hmFollow?1:0)-(b.hmFollow?1:0)||(hmHeavy(b)?1:0)-(hmHeavy(a)?1:0)||(b.core?1:0)-(a.core?1:0)||a.prio-b.prio}
function cvoteBlocked(b){const H=S.hm;return b.hm.stage==='cvote'&&!chairGov(b.house,b.comm)&&!b.agreed[b.house]&&!H.peace&&hmHeavy(b)}
function hmActive(){
  const H=S.hm;const out=[];
  for(const ln of ['shu','san']){
    const L=H.lanes[ln];
    if(L.inter.length){out.push({ref:L.inter[0],ln,inter:true});continue}
    const bs=hmBills().filter(b=>laneOf(b)===ln).sort(hmSort);
    const comm={};
    for(const b of bs){

      if(b&&S.rel.kyowa>=20){b.hmCourt=H.t;const its=b.mod!=='—'&&!b.modified&&modAcceptP(b)>20?['mod']:['futai','policy'];H.offer={items:its,t:H.t,kind:'vote',bill:b.id};hlog(`与党から改新の会に申し入れ：「${b.short}に賛成してほしい。${its.map(x=>HMOFFER[x].label).join('、')}を約束する」。`,'gov')}}
    if(!H.peace&&H.filed>=1&&sl<7&&H.t-H.lastDeal>=3&&rnd()<.5){const keep={rel:{...S.rel},k:S.kantei,p:S.party};hmDealGov(['seirin','tokui','shuchu'].sort(()=>rnd()-.5).slice(0,2));S.rel=keep.rel;S.kantei=keep.k;S.party=keep.p}
  } else if(!H.offer&&!H.peace&&(sl<7||hmBills().some(cvoteBlocked))&&H.t-H.lastOffer>=4&&(H.filed>=1||hmBills().some(cvoteBlocked))&&rnd()<.5){
    H.lastOffer=H.t;let its=['seirin','tokui','shuchu','futai'].sort(()=>rnd()-.5).slice(0,2+(sl<2?1:0));if(hmBills().some(cvoteBlocked)&&modAcceptP(hmBills()[0])>30)its=['mod'].concat(its.slice(0,1));

  }
  if(H.kind==='end'&&S.extUsed<S.extMax&&sl<-2&&!H.extTried&&H.t>H.dead-12){H.extTried=true;if(extendSession(1,'ai')){hlog('与党が会期延長を議決した。攻防は持ち越しに。','gov');hmAbort()}}
}
function hmAI(){if(!S.hm||S.hm.done)return;if(S.side==='gov')hmAIOpp();else if(S.side==='opp')hmAIGov();else{hmAIGov();hmAIOpp()}}
function hmAbort(){const H=S.hm;H.done=true;H.result={ok:null,aborted:true,title:'会期延長で攻防は持ち越し',text:'会期が延長されたため、通常の進行に戻る。'}}
function hmFinish(reason){
  const H=S.hm;if(H.done)return;H.done=true;const g=S.side==='gov';
  if(H.kind==='budget'&&reason!=='noconf'){
    const y=B('yosan');const ok=(y.house==='san'||y.phase==='done')&&y.recv!=null&&y.recv<=39;
    if(S.side==='mid'){H.result={ok:true,title:ok?'年度内成立が確定':'3月2日中の衆院通過ならず',text:ok?`総予算は${md(y.recv)}に衆院を通過した。`:'総予算は期限までに参院に送られなかった。年度内に成立させるには、参院が3月31日までに可決する必要がある。'};if(!ok)S.approval-=3}
    else if(ok){H.result={ok:g,title:'年度内成立が確定',text:`総予算は${md(y.recv)}に衆院を通過して参院に送られた。参院が議決しなくても${md(y.recv+29)}の24時を過ぎれば自然成立する。`};if(g)S.kantei+=8;else S.party-=2;log('vote','総予算が衆院を通過し、年度内成立が確定した。')}
    else{H.result={ok:!g,title:'3月2日中の衆院通過ならず',text:'総予算は期限までに参院に送られなかった。年度内に成立させるには、参院が3月31日までに可決する必要がある。間に合わなければ暫定予算が要る。'};S.approval-=3;if(g)S.kantei-=20;else{S.kantei+=12;S.party+=10;S.oppAppr+=.6}log('bad','総予算の衆院通過が3月2日に間に合わず、年度内の自然成立はなくなった。')}
  } else if(reason==='noconf'){H.result={ok:!g,title:'内閣不信任決議案が可決',text:'衆院は解散され、審議中の案件はすべて廃案になる。'}}
  else{
    const ids=H.ids.map(B).filter(Boolean);const done=ids.filter(b=>b.phase==='done');const left=ids.filter(b=>b.phase!=='done');
    const lh=left.filter(hmHeavy);H.result={ok:S.side==='mid'?true:g?left.length===0:lh.length>0,title:reason==='complete'?'会期末の攻防が決着':'会期終了の24時を迎えた',text:`成立 ${done.length}件（${done.filter(hmHeavy).map(b=>b.short).join('、')||'対決法案なし'}）。${left.length?`時間切れ・不成立 ${left.length}件：${left.slice(0,8).map(b=>b.short).join('、')}${left.length>8?'など':''}。`:''}`};
  }
  hlog(`${H.result.title}。`,H.result.ok?'vote':'bad');
  clampAll();
}
function hmClose(){
  const H=S.hm;if(!H||!H.done)return;
  for(const id of H.ids){const b=B(id);if(b){b.hmLocked=false;b.hm=null;b.hmFollow=false}}
  S.hmHist=(S.hmHist||[]).concat([{kind:H.kind,title:H.result.title,text:H.result.text,log:H.log.slice(0,60)}]);
  const kind=H.kind,ab=H.result.aborted;S.hm=null;

/* ================= 表示ヘルパ ================= */
function phaseText(b){
  const h=b.house;
  switch(b.phase){
    case 'pending':return b.member?'未提出':`提出予定（${md(pStart(Math.min(b.submit,S.phases.length-1)))}ごろ）`;
    case 'shelved':return `${HN[h]}・未付託（審議入りせず）`;
    case 'tsurushi':return `${HN[h]}・つるし（趣旨説明待ち）`;
    case 'committee':return `${HN[h]}・${commName(h,b.comm)}`;
    case 'plenary':return `${HN[h]}・本会議への上程待ち`;
    case 'kaifu':return `${HN[b.first]}・回付案の同意待ち`;
    case 'kyogikai':return '両院協議会';
    case 'rejected2':return '参院で否決（再可決待ち）';
    case 'done':return `成立 ${md(b.enactDay)}`;
    case 'dead':return b.note||'廃案';
  }
}
function billTags(b){
  const t=[];
  if(b.member==='gov')t.push(['与党議員立法','gov']);if(b.member==='opp')t.push(['野党提出','opp']);if(b.extraBill)t.push(['判定対象外','']);
  if(b.carried)t.push(['継続審査','']);
  if(b.type==='budget')t.push(['予算','acc']);if(b.deadline==='fy')t.push(['日切れ','warn']);if(b.imp)t.push(['重要広範','']);
  if(!b.member&&contested(b))t.push(['対決','bad']);
  if(b.first==='san')t.push(['参先議','']);if(b.core)t.push(['看板','gov']);if(b.modified)t.push(['修正','opp']);if(b.futai)t.push(['附帯決議','']);if(b.qgive)t.push(['質問時間を野党へ','']);
  if(b.comm.startsWith('sp_'))t.push(['特別委','acc']);
  if(b.partnerNo)t.push(['改連が反対','bad']);if(b.rebels)t.push([`造反の動き${b.rebels}`,'bad']);
  if(b.prio<0&&live(b))t.push(['優先','gov']);
  if(b.voteOrder==='agreed')t.push(['採決予定（合意）','ok']);if(b.voteOrder==='forced')t.push(['採決予定（合意なし）','bad']);if(b.voteOrder==='mid')t.push(['中間報告','bad']);
  if(b.voteDelay)t.push(['採決は次回以降','warn']);
  if(b.result==='orig')t.push(['原案成立','gov']);if(b.result==='mod')t.push(['修正成立','opp']);
  if(S.side==='mid'&&live(b)&&!b.member&&pivotal(b))t.push(['改新が鍵','acc']);if(S.side==='mid'&&live(b))t.push([`改新は${b.myVote==='yes'?'賛成':'反対'}`,b.myVote==='yes'?'ok':'bad']);
  if(S.halt[b.id])t.push(['審議中断','bad']);if(S.censured[b.min])t.push([`${b.min}問責`,'bad']);
  for(const p of Object.keys(b.deal))t.push([`${P[p].short}${b.deal[p]==='yes'?'賛成':b.deal[p]==='no'?'反対':'欠席'}の約束`,'acc']);
  return t.map(([x,c])=>`<span class="tag ${c}">${x}</span>`).join('');
}
function clockText(b){
  const out=[];const d=vDay();
  if(b.id==='yosan'&&b.house==='shu'&&live(b)&&S.kind==='tsujo'){const r=39-d;out.push(r>=0?`年度内自然成立の期限（3/2衆院通過）まで${r}日`:'3/2を過ぎた（年度内成立は参院の議決しだい）')}
  if(b.type==='budget'&&b.house==='san'&&b.phase==='committee'&&b.recv!=null)out.push(`自然成立 ${md(b.recv+29)}（あと${Math.max(0,b.recv+29-d)}日）`);
  if(b.type==='law'&&b.first==='shu'&&b.house==='san'&&b.phase==='committee'&&b.recv!=null&&b.member!=='opp'){const r=b.recv+60-d;out.push(r>0?`60日規定まで${r}日`:'みなし否決が可能')}
  if(b.deadline==='fy'&&S.kind==='tsujo'&&live(b)){const r=68-d;out.push(r>=0?`年度末まで${r}日`:'年度末を過ぎた')}
  return out.join(' / ');
}
function projLine(b,h){
  const t=tally(b,h,'plen',true);const tot=t.yes+t.no+t.und;
  const v=t.yes*2>tot?'ok':(t.yes+t.und)*2>tot?'warn':'bad';
  return `<span class="tag ${v}">${HN[h]} ${v==='ok'?'可決見込み':v==='warn'?'未定会派しだい':'否決見込み'}</span> <span class="num sm muted">賛${t.yes}${t.und?`・未定${t.und}`:''}・反${t.no}${t.abs?`・欠${t.abs}`:''}</span>`;
}
function stanceChips(b){return PIDS.map(p=>{const s=stance(p,b);const c=s==='yes'?'ok':s==='no'?'bad':'warn';return `<span class="tag ${c}">${P[p].short} ${s==='yes'?'賛成':s==='no'?'反対':s==='abs'?'欠席':'未定'}</span>`}).join('')}
function apDots(){let s='';for(let i=0;i<S.apMax;i++)s+=`<i class="${i<S.ap?'on':''}"></i>`;return s}
function relBar(p){return `<span class="relbar"><i style="width:${S.rel[p]}%"></i></span> <span class="num sm">${Math.round(S.rel[p])}</span>`}

function filterBills(list,f){
  switch(f){
    case 'focus':return list.filter(b=>(live(b)&&(contested(b)||b.voteOrder||b.phase==='tsurushi'||b.type==='budget'||S.halt[b.id]||b.deadline&&live(b)))||(b.phase==='plenary'));
    case 'live':return list.filter(b=>live(b));
    case 'pending':return list.filter(b=>b.phase==='pending');
    case 'done':return list.filter(b=>['done','dead'].includes(b.phase));
  }return list;
}
function congestion(){

}

function rulesView(){
  const c=(t,p,s)=>`<div class="card"><h4>${t}</h4><p>${p}</p>${s||''}</div>`;
  return `<section class="panel doc"><h2>ゲームに組み込んだ制度と慣行</h2><div class="rules">
   ${c('国対は国会の委員会ではない','国会対策委員会は各党・会派の組織。プレイヤーができるのは相手への働きかけと党内の調整で、採決は委員会・本会議という正式な場で行われます。',srcs('S2'))}
   ${c('二幹二国','与党第一党と野党第一党の幹事長・国対委員長がそろう会談。国対委員長どうしでは決着しない大きな案件を政治決着させる場として使われます。ゲームでは週1回、合意しやすい代わりに不調なら党内の評価が下がります。')}
   ${c('質問時間の配分','委員会の質疑時間は与野党で配分されます。与党が自らの時間を野党に回すと、審議時間が同じでも野党の質疑は厚くなり、採決日程の合意を得やすくなります。')}
   ${c('会期と延長','常会は150日で延長1回まで、臨時会は延長2回まで。両院の議決が一致しないときは衆院の議決が優先します。会期中に議決されない案件は原則として廃案。',srcs('S3','S6'))}
   ${c('予算の「3月2日」攻防（2024年の例）','総予算は、参院が受け取ってから30日以内に議決しなければ衆院の議決が国会の議決になります。3月2日までに参院へ送られれば年度内の成立が確定するため、与党はこの日までの衆院通過を目指し、野党は採決を引き延ばします。2024年は、首相が2月29日に政治倫理審査会に出席し、予算委員長が職権で3月1日の採決を決めました。野党は1日に予算委員長の解任決議案（本会議は13時12分開会、16時59分に否決して休憩）と財務大臣の不信任決議案（22時02分に再開、23時26分散会）で抵抗。2日（土）は予算委が午前9時に再開して予算案を可決し、昼の国対委員長会談で政倫審の継続や政治改革特別委員会の設置などで合意。15時32分開会の本会議で予算三案を賛成288・反対167で可決し、地方税法・地方交付税法・所得税法の改正案も同日に可決しました。ゲームでは3月1日から時間単位の攻防に切り替わります。',srcs('K1','K2','K3','K4','K5'))}
   ${c('キャスティングボート','与党が単独で過半数に届かないとき、第3党の票が法案の可否を決めます。少数与党の国会では、与党が第3党の求める修正や政策をのんで賛成を取り付けたり、第3党が自党の議員立法への協力を引き出したりする取引が行われます。ゲームの「第3党」モードでは改新の会を担当し、案件ごとに賛否を決めます。賛成の約束を破れば与党の信頼を失い、見返りなしに賛成すれば支持者から「与党の補完勢力」と見られます。')}
   ${c('一括採決と緊急上程','与野党の合意があれば、委員会で可決した法案をその日のうちに本会議へ緊急上程し、複数の案件をまとめて議題にして採決できます。会談では対象の案件を複数選び、「委員会採決の当日に本会議で一括採決」を条件にできます。',srcs('K2'))}
   ${c('予算委員会の審査の流れ','総予算は衆院予算委員会で、基本的質疑（全閣僚出席）→一般質疑→集中審議→公聴会→分科会→締めくくり質疑→採決と進むのが通例です。公聴会は総予算の審査で開くことが国会法51条で義務づけられています。分科会は衆院予算委員会に8つ置かれ、省庁別に予算を審査します（第1分科会は内閣・防衛など、第5分科会は厚生労働省など）。参院では分科会の代わりに各常任委員会に「委嘱審査」として省庁別審査を任せます。ゲームでは公聴会と分科会（委嘱審査）を終えないと予算委員会で採決できません。与党は日程を議決し、分科会では答弁準備を厚くする省を、野党は質問者を集中させる省を選びます。')}
   ${c('会期末の時間攻防','会期は最終日の24時で終わり、それまでに議決されない案件は審議未了で廃案になります。会期末は時間単位で進み、野党の決議案や長時間演説、牛歩に対し、与党は延会・発言時間の制限・投票時間の制限・会談で対抗します。総予算の委員会採決の前には公聴会を開く必要があり（国会法51条）、ゲームでは審議時間の8割に届くまで総予算を採決できません。',srcs('S3'))}
   ${c('暫定予算','本予算が年度開始までに成立しない見込みのとき、政府は一定期間の必要経費を計上した暫定予算を国会に提出します。本予算が成立すれば吸収されます。',srcs('ZT'))}
   ${c('本会議の定例日と土曜・深夜','原則として衆院本会議は火・木・金、参院は月・水・金。会期末には土曜の開会や、延会して深夜まで続く本会議もあります。会期は最終日の24時で終わります。',srcs('S8'))}
   ${c('特別委員会','各院は本会議の議決で特別委員会を置けます。2026年6月には定数削減法案が政治改革特別委員会で、委員長の職権により野党欠席のまま審議入りしました。',srcs('S3','N1'))}
   ${c('議員立法と継続審査','法律案は議員も提出できます。閉会中審査の手続を取れば次の国会に引き継がれます。定数削減法案は2026年7月に衆院で継続審議となりました。野党の議員立法の多くは審議入りしないまま終わります。',srcs('S3','N2'))}
   ${c('対案','2026年秋の国会では、消費減税法案に対して野党が給付や減税の対案を示しました。',srcs('N3','N4'))}
   ${c('つるし','重要な法案について本会議での趣旨説明が求められていると、委員会に付託されません。',srcs('S2'))}
   ${c('定足数と表決','本会議の定足数は総議員の3分の1、委員会は委員の半数。議決は出席者の過半数で、可否同数なら議長・委員長が決めます。欠席した議員の票は数えません。',srcs('S3','S7'))}
   ${c('予算の30日','参院が予算を受け取って30日以内に議決しなければ、衆院の議決が国会の議決になります。',srcs('S7','S14'))}
   ${c('法律案の60日と再可決','参院が60日以内に議決しないと、衆院は否決とみなせます。成立には衆院で出席議員の3分の2以上の再可決が必要です。',srcs('S7'))}
   ${c('日程合意と賛否は別','採決日程に合意しても、賛成するとは限りません。2024年3月の与野党国対会談では、予算の採決日程に合意したうえで野党は反対しました。',srcs('S15'))}
   ${c('附帯決議と修正','附帯決議は運用への注文で、条文と同じ効力はありません。ゲームでも附帯決議は「原案成立」のままです。',srcs('S12'))}
   ${c('決議案と抵抗手段','内閣不信任決議案は先決案件として扱われ、その間ほかの議事は止まります。大臣不信任、議長不信任、委員長や議運委員長の解任決議案なども、会期末の日程闘争で次々に出されることがあります。乱発すれば「日程闘争」との批判も受けます。同じ会期に同じ内閣不信任案は出せません（一事不再議）。',srcs('S4','S5'))}
   ${c('閣僚の出席','委員会審議には担当大臣の出席が求められます。政府は副大臣や政府参考人で対応することもあり、野党は「大臣隠し」と反発します。問責された大臣が出る審議を野党が拒むこともあります。')}
   ${c('中間報告','委員会の審査中に本会議が中間報告を求め、本会議で採決できる例外的な手続（国会法56条の3）。',srcs('S3','S21'))}
   ${c('不信任と問責','衆院で内閣不信任決議が可決されると、10日以内に解散しない限り内閣は総辞職します。参院の問責決議に法的拘束力はないとするのが政府見解です。',srcs('S7','S13'))}
  </div>
  <h2 style="margin-top:6px">ゲーム用に単純化した点</h2>
  <ul style="margin:0;padding-left:1.2em;max-width:76ch">
   <li>委員会の開会枠はフェーズごとに一律（衆2時間・参1.7時間、予算委は衆8・参6.7時間）。予算審議中は関連法案以外の委員会がほぼ止まる慣行を簡略化しています。</li>
   <li>定例の法案は、審議時間が目安に届けば理事会で日程合意されるとしています。実際の理事会協議はもっと複雑です。</li>
   <li>案件名は実在の法令名を参考にした架空のものです。会派と政党は同一とみなし、委員会の構成は院の議席比で配分しています。</li>
   <li>官邸・党内の要請、会派ごとの反応、約束が破られる確率、支持率や世論の動きはゲーム用の仮定です。実在の政党や政治家の行動を予測するものではありません。</li>
  </ul></section>`;

   ${desks}${boySign}<g transform="translate(1040,240)"><rect x="-22" y="-20" width="44" height="30" fill="#333"/><rect x="18" y="-12" width="16" height="14" fill="#555"/><rect x="-4" y="10" width="8" height="40" fill="#444"/></g>`;

function sMeeting(c){
  const win=c.night?'#22304d':'#bcd8ee';const me=meChar(),rv=S.side==='mid'?{pin:PCOL.kyowa,tie:'#b04040',hs:'part',hair:'#c8c8c8',suit:'#2c3a52'}:rivalChar();

    :pp(430,300,Object.assign({s:1,label:'あなた',lc:'#5a3d86',point:true},me))+pp(770,300,Object.assign({s:1,label:`${rvP} 国対委員長`,lc:'#444',flip:true},rv));
  return `<rect width="1200" height="340" fill="#e9dfcc"/><rect x="0" y="0" width="1200" height="20" fill="#d4c6ad"/>
   <rect x="120" y="40" width="220" height="140" fill="${win}" stroke="#a8977a" stroke-width="8"/><line x1="230" y1="40" x2="230" y2="180" stroke="#a8977a" stroke-width="6"/>
   <rect x="860" y="40" width="220" height="140" fill="${win}" stroke="#a8977a" stroke-width="8"/><line x1="970" y1="40" x2="970" y2="180" stroke="#a8977a" stroke-width="6"/>

   ${sceneClock(60,110,c.clock)}${people}
   <rect x="250" y="250" width="700" height="90" fill="#fbfaf6"/><rect x="250" y="246" width="700" height="10" fill="#e8e3d6"/>
   <g><rect x="330" y="262" width="150" height="26" fill="#fff" stroke="#999"/><text x="405" y="280" font-size="12.5" text-anchor="middle" fill="#222" font-family="Zen Kaku Gothic New,sans-serif">${myP}</text></g>
   <g><rect x="720" y="262" width="150" height="26" fill="#fff" stroke="#999"/><text x="795" y="280" font-size="12.5" text-anchor="middle" fill="#222" font-family="Zen Kaku Gothic New,sans-serif">${rvP}</text></g>
   <rect x="560" y="268" width="80" height="16" fill="#fff" stroke="#ccc"/><rect x="590" y="236" width="20" height="16" rx="3" fill="#cfe3ee"/>
   <g opacity=".95">${npc('pr1',1110,330,{s:.55,mic:true,casual:true,suit:'#6a6a7a'})}${npc('pr2',60,330,{s:.55,casual:true,suit:'#5a6a5a'})}</g>`;
}
function sOffice(c){
  const kantei=c.from!=='party';
  const who=kantei?{label:'官房長官',hs:'part',hair:'#aaa',gl:true}:{label:S.side==='gov'?'幹事長':'党代表',hs:'bald',hair:'#888',gl:false};
  return `<rect width="1200" height="340" fill="${kantei?'#e6e1d5':'#e8e4dc'}"/><rect x="0" y="250" width="1200" height="90" fill="#9b7b5a"/>
   <rect x="80" y="40" width="260" height="190" fill="#7a5a3a"/>${Array.from({length:4},(_,r)=>Array.from({length:8},(_,i)=>`<rect x="${92+i*30}" y="${54+r*44}" width="${18+(i*7)%9}" height="34" fill="${['#8a3a3a','#3a5a8a','#3a6a4a','#8a7a3a'][(r+i)%4]}"/>`).join('')).join('')}
   <rect x="${kantei?960:960}" y="40" width="4" height="200" fill="#777"/>${kantei?`<rect x="964" y="44" width="110" height="74" fill="#fff" stroke="#ddd"/><circle cx="1019" cy="81" r="22" fill="#c8102e"/>`:`<rect x="964" y="44" width="110" height="74" fill="${PCOL[S.me]}"/><text x="1019" y="88" font-size="16" text-anchor="middle" fill="#fff" font-family="Shippori Mincho B1,serif">${P[S.me].short}</text>`}
   <rect x="560" y="40" width="140" height="34" rx="4" fill="#5a4636"/><text x="630" y="63" font-size="14.5" text-anchor="middle" fill="#f3e3c3" font-family="Shippori Mincho B1,serif">${kantei?(S.side==='gov'?'首相官邸':'党本部'):'党本部'}</text>
   ${npc('chief'+who.label,640,250,Object.assign({s:.95,lc:'#444'},who))}<rect x="520" y="206" width="250" height="60" fill="#5a3d22"/><rect x="510" y="200" width="270" height="12" fill="#6a4628"/>
   ${pp(380,320,Object.assign({s:1,label:'あなた',lc:'#5a3d86',paper:true},meChar()))}${npc('aide',880,320,{s:.85,paper:true,label:'秘書',lc:'#666'})}`;
}
function sPress(c){
  let reps='';const pos=[[150,330],[250,320],[350,330],[850,330],[950,320],[1050,330]];
  pos.forEach(([x,y],i)=>{reps+=npc('press'+i,x,y,{s:.82,mic:i%2===0,casual:true,suit:['#5a6a7a','#6a5a4a','#4a5a4a','#7a6a5a'][i%4],flip:x>600})});
  const cams=[200,1000].map(x=>`<g transform="translate(${x},200)"><rect x="-26" y="-18" width="52" height="34" rx="4" fill="#2a2a2a"/><circle cx="0" cy="0" r="11" fill="#555" stroke="#888" stroke-width="3"/><rect x="-6" y="16" width="12" height="80" fill="#333"/></g>`).join('');
  const flash=[[300,120],[880,150],[520,90]].map(([x,y],i)=>`<g class="flash" style="animation-delay:${i*.4}s"><path d="M${x},${y-18} L${x+5},${y-5} L${x+18},${y} L${x+5},${y+5} L${x},${y+18} L${x-5},${y+5} L${x-18},${y} L${x-5},${y-5}z" fill="#fff8d0"/></g>`).join('');
  return `<rect width="1200" height="340" fill="#d6dbe2"/><rect x="380" y="30" width="440" height="200" fill="#2c3a52"/><text x="600" y="72" font-size="20" text-anchor="middle" fill="#f3efe4" font-family="Shippori Mincho B1,serif" font-weight="800">記者会見・取材</text>
   <rect x="0" y="260" width="1200" height="80" fill="#b9bfc8"/>${cams}${pp(600,300,Object.assign({s:1.05,label:'あなた',lc:'#5a3d86'},meChar()))}<rect x="560" y="218" width="80" height="84" fill="#5a3d22"/><rect x="590" y="200" width="6" height="22" fill="#333"/><rect x="604" y="200" width="6" height="22" fill="#333"/>${reps}${flash}`;
}
function sceneView(){
  if(UI.noScene)return `<div class="scenebar"><button class="btn small" data-a="sceneToggle">場面を表示</button></div>`;
  const c=sceneCtx();
  const loc={exterior:'国会議事堂',plenary:`${c.house==='san'?'参議院':'衆議院'}本会議場`,committee:`${c.house==='san'?'参議院':'衆議院'} ${c.title||'委員会室'}`,meeting:'国会内・国対委員長室',office:c.from==='party'?'党本部':'首相官邸',press:'国会内・記者会見'}[c.k];
  const body={exterior:sExterior,plenary:sPlenary,committee:sCommittee,meeting:sMeeting,office:sOffice,press:sPress}[c.k](c);
  const cap=(c.cap||'').replace(/^【[^】]*】/,'').slice(0,120);
  const tm=S.hm?hmClock(S.hm.t,true):`${md(pStart())}（${wdy(pStart())}）${PH_NAME[PH().key].slice(0,2)}`;
  return `<figure class="scene" aria-label="${esc(loc)}の場面"><svg viewBox="0 0 1200 340" preserveAspectRatio="xMidYMid slice" role="img">${body}${c.night?'<rect width="1200" height="340" fill="#0a1430" opacity=".18"/>':''}</svg>
   <div class="loc">${esc(loc)}</div><div class="stime num">${esc(tm)}</div><button class="btn small hide" data-a="sceneToggle">場面を隠す</button>
   ${cap?`<figcaption>${esc(cap)}</figcaption>`:''}</figure>`;
}
A.sceneToggle=()=>{UI.noScene=!UI.noScene;try{localStorage.setItem('kokutai-noscene',UI.noScene?'1':'')}catch(e){}render()};


render();

</script>
